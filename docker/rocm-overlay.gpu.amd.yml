# AMD ROCm overlay — single AMD GPU.
# Enable by setting COMPOSE_FILE in .env:
#   COMPOSE_FILE=docker-compose.yml:docker/rocm-overlay.gpu.amd.yml
#   RENDER_GID=18
#
# Requirements:
#   AMD — ROCm drivers on host (/dev/kfd + /dev/dri).
#          Find your render GID: getent group render | cut -d: -f3
#          On Unraid this is usually 18 (same as the video group).
#
# For AMD + NVIDIA dual-GPU support use docker/gpu.amd-nvidia.yml instead.
services:
  odysseus:
    build:
      context: .
      dockerfile: Dockerfile.rocm-overlay
      args:
        BASE_IMAGE: ${ODYSSEUS_IMAGE:-zenth815/odysseus-frontend:latest}
        ROCM_VERSION: ${ROCM_VERSION:-6.1.2}
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - ${RENDER_GID:-render}
    environment:
      - ROCM_PATH=/opt/rocm
      - HIP_PATH=/opt/rocm
      - HIPCXX=/opt/rocm/llvm/bin/clang++
      - CXXFLAGS=-Wno-narrowing -Wno-c++11-narrowing
      - HIPCXXFLAGS=-Wno-narrowing -Wno-c++11-narrowing
