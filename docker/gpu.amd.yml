# AMD ROCm GPU overlay. Enable by setting COMPOSE_FILE in .env:
#   COMPOSE_FILE=docker-compose.yml:docker/gpu.amd.yml
#   RENDER_GID=<numeric output of: getent group render | cut -d: -f3>
#
# Requires ROCm drivers on the host (kfd + DRI devices). The host user
# running Docker must be in the `video` and `render` groups.
#
# This overlay only passes the host GPU through to the container.
# The slim Odysseus image does not bundle ROCm userspace or inference
# engines. For AMD gfx906, running zenth815/mx-llama-rocm10-gfx906 as its own
# sidecar container and registering it as a Model Endpoint is the recommended
# path (see docker/llama-rocm.yml + README.md "GPU Support"). This overlay
# still matters if you want Cookbook to install ROCm-compatible vLLM /
# llama-cpp-python wheels (or compile from source) inside the Odysseus
# container itself via Cookbook -> Dependencies.
services:
  odysseus:
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - ${RENDER_GID:-render}
