# NVIDIA llama.cpp GPU sidecar, using the official upstream CUDA image
# (no custom build needed -- NVIDIA is officially supported by mainline
# llama.cpp) plus an SSH server, so Cookbook's own SSH-remote-exec machinery
# can drive it exactly like any other remote target -- GGUF picker,
# Launch/Stop/Reload, every Advanced flag, tmux-tracked lifecycle. Nothing
# here is Cookbook-blind.
#
# Requires the NVIDIA Container Toolkit on the host (see docker/gpu.nvidia.yml
# for install steps).
#
# Enable by setting COMPOSE_FILE in .env:
#   COMPOSE_FILE=docker-compose.yml:docker/llama-cuda.yml
#
# "Local" + CUDA in Cookbook's Launch screen transparently redirects here
# when ODYSSEUS_LOCAL_LLAMA_CUDA_HOST is set (see model_serve() in
# routes/cookbook_routes.py) -- set it to root@llama-cuda in .env to make
# that work without touching a saved remote-server entry:
#   ODYSSEUS_LOCAL_LLAMA_CUDA_HOST=root@llama-cuda
#
# Requires Cookbook's own SSH key to already exist before this container
# first starts (Cookbook -> Settings -> generate SSH key) -- its pubkey is
# what gets trusted below. The huggingface cache dir is the SAME host
# directory Odysseus itself uses, so whatever Cookbook downloads locally is
# immediately visible here too, at the same path -- no separate download step.
services:
  llama-cuda:
    container_name: llama-cuda
    build:
      context: .
      dockerfile: docker/llama-cuda-ssh.Dockerfile
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR:-./data}/ssh/id_ed25519.pub:/run/secrets/cookbook_ssh_pubkey:ro
      - ${APP_DATA_DIR:-./data}/huggingface:/app/.cache/huggingface:z
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
