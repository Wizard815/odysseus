# AMD gfx906 (MI50/MI60/Radeon VII) llama.cpp GPU sidecar.
#
# Runs the gfx906-tuned llama-server from zenth815/mx-llama-rocm10-gfx906
# (custom SGEMM/RoPE/MMQ kernels, built on ROCm 10) plus an SSH server, so
# Cookbook's own SSH-remote-exec machinery can drive it exactly like any
# other remote target -- GGUF picker, Launch/Stop/Reload, every Advanced
# flag, tmux-tracked lifecycle. Nothing here is Cookbook-blind.
#
# Enable by setting COMPOSE_FILE in .env:
#   COMPOSE_FILE=docker-compose.yml:docker/llama-rocm.yml
#   RENDER_GID=<output of: getent group render | cut -d: -f3>
#
# "Local" + ROCm in Cookbook's Launch screen transparently redirects here
# when ODYSSEUS_LOCAL_LLAMA_ROCM_HOST is set (see model_serve() in
# routes/cookbook_routes.py) -- set it to root@llama-rocm in .env to make
# that work without touching a saved remote-server entry:
#   ODYSSEUS_LOCAL_LLAMA_ROCM_HOST=root@llama-rocm
#
# Requires Cookbook's own SSH key to already exist before this container
# first starts (Cookbook -> Settings -> generate SSH key) -- its pubkey is
# what gets trusted below. The huggingface cache dir is the SAME host
# directory Odysseus itself uses, so whatever Cookbook downloads locally is
# immediately visible here too, at the same path -- no separate download step.
services:
  llama-rocm:
    container_name: llama-rocm
    build:
      context: .
      dockerfile: docker/llama-rocm-ssh.Dockerfile
    restart: unless-stopped
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - ${RENDER_GID:-render}
    volumes:
      - ${APP_DATA_DIR:-./data}/ssh/id_ed25519.pub:/run/secrets/cookbook_ssh_pubkey:ro
      - ${APP_DATA_DIR:-./data}/huggingface:/app/.cache/huggingface:z
    environment:
      - HIP_VISIBLE_DEVICES=${HIP_VISIBLE_DEVICES:-0}
