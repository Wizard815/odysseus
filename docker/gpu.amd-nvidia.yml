# AMD ROCm + NVIDIA dual-GPU overlay. Enable by setting COMPOSE_FILE in .env:
#   COMPOSE_FILE=docker-compose.yml:docker/gpu.amd-nvidia.yml
#   RENDER_GID=<output of: getent group render | cut -d: -f3>
#
# Requirements:
#   AMD    — ROCm drivers on the host (/dev/kfd + /dev/dri). See docker/gpu.amd.yml.
#   NVIDIA — NVIDIA Container Toolkit installed on the host. See docker/gpu.nvidia.yml.
#
# The slim Odysseus image does not bundle ROCm or CUDA userspace. Running
# zenth815/mx-llama-rocm10-gfx906 and ghcr.io/ggml-org/llama.cpp:server-cuda
# as their own sidecar containers, each registered as a Model Endpoint, is
# the recommended path for a mixed AMD+NVIDIA host (see docker/llama-rocm.yml,
# docker/llama-cuda.yml, README.md "GPU Support"). This overlay still matters
# if you want Cookbook's dual-build wrapper (routes/cookbook_helpers.py) to
# compile llama-server-hip and llama-server-cuda from source inside the
# Odysseus container itself and route between them via HIP_VISIBLE_DEVICES.
services:
  odysseus:
    # Persist the Cookbook-built llama.cpp binaries (~/bin) and source/build
    # tree (~/llama.cpp) across container recreates. Without this, every
    # `docker compose up -d --build` / image update wipes the compiled
    # llama-server-hip / llama-server-cuda binaries (they live in the
    # container's writable layer, not a volume), forcing a full HIP+CUDA
    # recompile on the next serve — or, if that rebuild half-fails, a silent
    # CPU fallback. Both paths must be persisted together: the thin
    # llama-server binaries dynamically link the .so files under
    # ~/llama.cpp/build*/bin, so persisting one without the other breaks them.
    volumes:
      - ${APP_DATA_DIR:-./data}/llama-cpp/bin:/app/bin:z
      - ${APP_DATA_DIR:-./data}/llama-cpp/src:/app/llama.cpp:z
      # Separate checkout used only when LLAMACPP_ROCM_REPO is set (see
      # cookbook_helpers.py's _rocm_llama_cpp_repo()) — persisted too, else
      # every container recreate re-clones and rebuilds the fork from scratch.
      - ${APP_DATA_DIR:-./data}/llama-cpp/rocm-src:/app/llama.cpp-rocm:z
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - ${RENDER_GID:-render}
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Passed through so cookbook_helpers.py's _rocm_llama_cpp_repo() can see
      # it — .env alone only feeds ${VAR} substitution in this YAML, it does
      # NOT inject into the container process without an explicit line here.
      - LLAMACPP_ROCM_REPO=${LLAMACPP_ROCM_REPO:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
